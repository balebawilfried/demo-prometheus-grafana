# Configuration du monitoring de nos ressources du point de vue de l'utilisateur final 
modules:
  # Nous allons utiliser le prober HTTP pour tester la cible
  # Blackbox va effectuer une requête HTTP et déterminer si la probe réussit
  http_2xx:
    prober: http

  http_ipv4:
    prober: http
    http:
      # Blackbox va privilégier IPv4
      preferred_ip_protocol: ip4

  http_find_content:
    prober: http
    http:
     preferred_ip_protocol: ip4
     # verifie que le contenu de la réponse HTTP contient la valeur(Facebook)
     fail_if_body_not_matches_regexp:
      - "Facebook"

  # Blackbox va interroger le serveur DNS avec une requête pour www.google.com
  dns_sample:
    prober: dns
    dns: 
      transport_protocol: "tcp"
      preferred_ip_protocol: ip4
      query_name: "www.google.com"

  # Blackbox teste une API 
  http_post_2xx:
    prober: http
    http:
      method: POST

  tcp_connect:
    prober: tcp

  pop3s_banner:
    prober: tcp
    tcp:
      query_response:
      # Blackbox attend que le serveur renvoie quelque chose qui commence par OK
      - expect: "^+OK"
      tls: true
      tls_config:
        insecure_skip_verify: false

  grpc:
    prober: grpc
    grpc:
      tls: true
      preferred_ip_protocol: "ip4"
  
  grpc_plain:
    prober: grpc
    grpc:
      tls: false
      service: "service1"
  
  ssh_banner:
    prober: tcp
    tcp:
      query_response:
      - expect: "^SSH-2.0-"
      - send: "SSH-2.0-blackbox-ssh-check"
  
  irc_banner:
    prober: tcp
    tcp:
      query_response:
      - send: "NICK prober"
      - send: "USER prober prober prober :prober"
      - expect: "PING :([^ ]+)"
        send: "PONG ${1}"
      - expect: "^:[^ ]+ 001"
  
  icmp:
    prober: icmp
  
  icmp_ttl5:
    prober: icmp
    timeout: 5s
    icmp:
      ttl: 5
