services:
  # Configuration de node exporter
  metrics_vm:
    image: prom/node-exporter:latest
    container_name: metrics_vm
    # il permet de monitoré la machine sur la laquelle, il est!
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    #expose:
      #- 9100
    #networks:
      #- monitoring


  # Configuration de blackbox exporter
  blackbox_endpoint:
    image: prom/blackbox-exporter
    #quay.io/prometheus/blackbox-exporter:latest
    container_name: blackbox_endpoint
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox_exporter/config:/config
      - ./blackbox_exporter/blackbox.yml:/config/blackbox.yml
    command:
      - '--config.file=/config/blackbox.yml'
    #expose:
      #- 9115
    #networks:
      #- monitoring


  # ajout de alerte manager pour la configuration des notifications (email, slack, etc)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - 9093:9093
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    #expose:
      #- 9093
    #networks:
      #- monitoring


  # Configuration de prometheus
  prometheus:
    image: prom/prometheus:latest
    # image prometheus durcit
    #image: dhi.io/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    #depends_on:
      #- metrics_vm
      #- metrics_containers
    #expose:
      #- 9090
    #networks:
      #- monitoring


